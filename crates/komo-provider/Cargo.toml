[package]
name = "komo-provider"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
# `stream` on top of the workspace features: every completion is read as SSE
# through `bytes_stream()`.
reqwest = { workspace = true, features = ["stream"] }
bytes = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
# Parses a `Retry-After` HTTP-date, so the server's own pacing beats local backoff.
chrono = { workspace = true }
# Only `time::timeout`, guarding an SSE stream that stalls mid-completion —
# deliberately not tokio's `full`.
tokio = { version = "1.53.1", features = ["time"] }

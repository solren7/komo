[package]
name = "komo-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
# Client only: rmcp's default features pull in the whole server side plus
# schemars/macros, none of which a client needs.
rmcp = { version = "3.1.1", default-features = false, features = [
    "client",
    "transport-streamable-http-client-reqwest",
    # rustls, matching komo's own reqwest — the `reqwest-native-tls` variant
    # would link a second TLS stack into the binary for nothing.
    "reqwest",
] }
tokio = { version = "1.53.1", features = ["rt", "time"] }
reqwest = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }

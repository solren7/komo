name: apps

# The JS/TS clients (apps/) have their own toolchain and are not part of the
# cargo build, so they get their own job. Runs only when they change.
on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/apps.yml"]
  pull_request:
    paths: ["apps/**", ".github/workflows/apps.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run test
      # Both hosts must actually bundle — a broken alias or stylesheet import
      # only shows up here.
      - run: bun run build

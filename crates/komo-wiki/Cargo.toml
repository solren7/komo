[package]
name = "komo-wiki"
version = "0.1.0"
edition = "2024"

# The vector backends live alone in this crate on purpose. Together they bring
# ~130 transitive crates, and this repo's crate split exists to keep that weight
# off everything else's compile path: only the binary's wiring depends on
# `komo-wiki`, so editing `komo-infra` or `komo-tools` never pulls this in, and
# it compiles in parallel with them.
#
# Both backends are always compiled rather than feature-gated: `qdrant-client`
# adds only 5 crates on top of `qdrant-edge` (they share tonic, and komo already
# has reqwest/futures), so gating would buy nothing and cost a build matrix.
[dependencies]
komo-core = { path = "../komo-core" }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
# Chunk ids are strings (`path#ordinal`) but Qdrant point ids may only be u64 or
# UUID, so ids are derived as UUIDv5 — see `payload::point_id`.
uuid = { workspace = true, features = ["v5"] }
tokio = { version = "1.53.1", features = ["full"] }
# Embedded backend: in-process, no daemon. Beta (0.8) — its API is documented as
# subject to change, which is survivable only because `WikiIndex` confines it to
# this crate.
qdrant-edge = "0.8.0"
# Server backend: gRPC to a Qdrant instance, so several processes (komo here,
# komo on the NAS, open-webui) can share one collection.
#
# `default-features = false` is load-bearing: the default `download_snapshots`
# feature pulls reqwest with the aws-lc-rs TLS provider, whose `aws-lc-sys`
# needs cmake and a C toolchain to build. Dropping it falls back to ring (pure
# Rust) and keeps `cargo build` working on a machine without cmake.
qdrant-client = { version = "1.19.0", default-features = false, features = [
    "serde",
] }

[dev-dependencies]
tempfile = "3"
